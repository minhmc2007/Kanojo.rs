[package]
name = "kanojo"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kanojo"
path = "src/main.rs"

[dependencies]
kanojod-ipc = { path = "../kanojod-ipc" }
kanojo-config = { path = "../kanojo-config" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
