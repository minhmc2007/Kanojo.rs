[package]
name = "kanojod"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kanojod"
path = "src/main.rs"

[dependencies]
kanojod-db = { path = "../kanojod-db" }
kanojod-ipc = { path = "../kanojod-ipc" }
kanojo-config = { path = "../kanojo-config" }
kanojo-typo = { path = "../kanojo-typo" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
